<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alara Birthday Cake ❤️</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Georgia,serif;
  color:#713d55;
  background:
    radial-gradient(circle at 50% 15%,#ffe0eb,transparent 45%),
    #fff8f6;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.content{
  width:100%;
  max-width:440px;
  text-align:center;
}

.eyebrow{
  font:11px Arial,sans-serif;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#aa7185;
}

h1{
  font-size:34px;
  color:#813f5b;
  margin:10px 0;
}

.sub{
  font:15px Arial,sans-serif;
  line-height:1.7;
  color:#80606c;
}

.btn{
  border:0;
  border-radius:50px;
  padding:14px 24px;
  margin:10px 5px;
  background:#fff;
  color:#a04d70;
  font:bold 15px Arial,sans-serif;
  box-shadow:0 10px 28px #9b5b711f;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* MUSIC BUTTON */
.music{
  position:fixed;
  right:15px;
  top:15px;
  z-index:500;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#ffffffe8;
  font-size:20px;
  color:#9b4d70;
  box-shadow:0 8px 22px #461e321f;
}

.music.on{
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* CAKE AREA */
.cake-area{
  position:relative;
  width:320px;
  height:310px;
  margin:4px auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CAKE */
.cake-emoji{
  font-size:155px;
  position:relative;
  z-index:3;
  filter:drop-shadow(0 14px 12px rgba(100,40,70,.18));
  transition:.35s;
}

.cake-emoji.shake{
  animation:cakeShake .55s ease;
}

@keyframes cakeShake{
  20%{
    transform:rotate(-5deg);
  }
  40%{
    transform:rotate(5deg);
  }
  60%{
    transform:rotate(-3deg);
  }
  80%{
    transform:rotate(3deg);
  }
  100%{
    transform:rotate(0);
  }
}

/* CANDLES */
.candles{
  position:absolute;
  top:47px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:17px;
  z-index:5;
}

.mini-candle{
  width:17px;
  height:45px;
  background:
    linear-gradient(
      90deg,
      #e79bb5,
      #fff0f5,
      #d87899
    );
  border-radius:5px 5px 3px 3px;
  position:relative;
  cursor:pointer;
  box-shadow:0 3px 6px rgba(80,30,50,.15);
}

.mini-candle span{
  position:absolute;
  left:-3px;
  top:-30px;
  font-size:22px;
  transition:.25s;
}

.mini-candle.off span{
  opacity:0;
  transform:scale(.2) translateY(15px);
}

/* KNIFE */
.knife{
  position:absolute;
  right:18px;
  bottom:45px;
  font-size:54px;
  z-index:10;
  transform:rotate(-20deg);
  opacity:0;
  pointer-events:none;
}

.knife.show{
  opacity:1;
  animation:knifeReady .7s ease;
}

@keyframes knifeReady{
  from{
    transform:translate(80px,-50px) rotate(-50deg);
    opacity:0;
  }

  to{
    transform:translate(0,0) rotate(-20deg);
    opacity:1;
  }
}

.knife.cut{
  animation:knifeCut .9s ease forwards;
}

@keyframes knifeCut{
  0%{
    transform:translate(0,0) rotate(-20deg);
  }

  45%{
    transform:translate(-105px,45px) rotate(-45deg);
  }

  70%{
    transform:translate(-85px,65px) rotate(-45deg);
  }

  100%{
    transform:translate(0,0) rotate(-20deg);
  }
}

/* CAKE CUT */
.cake-emoji.cut{
  animation:cakeCut .9s ease;
}

@keyframes cakeCut{
  0%{
    transform:scale(1);
  }

  35%{
    transform:scale(1.08) rotate(-3deg);
  }

  55%{
    transform:scale(.96) rotate(3deg);
  }

  100%{
    transform:scale(1);
  }
}

/* CELEBRATION */
.cake-spark{
  position:fixed;
  pointer-events:none;
  z-index:1000;
  font-size:25px;
  animation:cakeSpark 1.7s ease forwards;
}

@keyframes cakeSpark{
  0%{
    transform:translate(0,0) scale(.5);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
      translate(var(--dx),var(--dy))
      scale(1.2)
      rotate(360deg);
    opacity:0;
  }
}

.done{
  margin-top:4px;
  font:bold 17px Arial;
  color:#9b4d70;
  min-height:26px;
}
</style>
</head>


<body>

<!-- MUSIC BUTTON -->
<button
  class="music"
  id="musicBtn"
  onclick="toggleMusic()">
  🎵
</button>


<div class="content">

  <div class="eyebrow">
    Birthday Cake
  </div>

  <h1>
    Time to Cut the Cake 🎂
  </h1>


  <!-- CAKE -->
  <div class="cake-area">

    <div
      class="cake-emoji"
      id="cakeEmoji">
      🎂
    </div>


    <!-- CANDLES -->
    <div class="candles">

      <div
        class="mini-candle"
        onclick="cakeCandle(this)">
        <span>🔥</span>
      </div>

      <div
        class="mini-candle"
        onclick="cakeCandle(this)">
        <span>🔥</span>
      </div>

      <div
        class="mini-candle"
        onclick="cakeCandle(this)">
        <span>🔥</span>
      </div>

    </div>


    <!-- KNIFE -->
    <div
      class="knife"
      id="knife">
      🔪
    </div>

  </div>


  <p
    class="sub"
    id="cakeText">

    Tap all three candles and
    make your birthday wish ✨

  </p>


  <div
    id="done"
    class="done">
  </div>


  <!-- CUT BUTTON -->
  <button
    class="btn hidden"
    id="cutBtn"
    onclick="cutCake()">

    Cut the Cake 🔪

  </button>


  <!-- AGAIN BUTTON -->
  <button
    class="btn hidden"
    id="againBtn"
    onclick="location.reload()">

    See It Again 🔄

  </button>

</div>


<script>

/* =========================
   CAKE SYSTEM
========================= */

let cakeCandlesOff = 0;
let cakeCutDone = false;


/* Candle tap */
function cakeCandle(el){

  if(el.classList.contains("off")){
    return;
  }

  /* Turn candle off */
  el.classList.add("off");

  cakeCandlesOff++;


  /* Cake shake */
  const cake =
    document.getElementById("cakeEmoji");

  cake.classList.add("shake");

  setTimeout(function(){

    cake.classList.remove("shake");

  },600);


  /* All candles OFF */
  if(cakeCandlesOff === 3){

    document.getElementById("cakeText")
      .textContent =
      "Wish made! ✨ Now cut your birthday cake 🎂";


    document.getElementById("cutBtn")
      .classList.remove("hidden");


    document.getElementById("knife")
      .classList.add("show");


    /* Celebration */
    confetti();


    /* Birthday music */
    startMusic();
  }

}


/* =========================
   CUT CAKE
========================= */

function cutCake(){

  if(cakeCutDone){
    return;
  }

  cakeCutDone = true;


  /* Knife animation */
  document.getElementById("knife")
    .classList.add("cut");


  /* Cake animation */
  document.getElementById("cakeEmoji")
    .classList.add("cut");


  /* Hide cut button */
  document.getElementById("cutBtn")
    .classList.add("hidden");


  /* Message */
  document.getElementById("cakeText")
    .textContent =
    "Cake cut! 🎂❤️ Happy Birthday, Alara!";


  document.getElementById("done")
    .textContent =
    "✨ The birthday cake is officially cut! ✨";


  /* Big celebration */
  cakeCelebration();


  /* Show again button */
  setTimeout(function(){

    document.getElementById("againBtn")
      .classList.remove("hidden");

  },900);

}


/* =========================
   CELEBRATION
========================= */

function cakeCelebration(){

  const items = [
    "🎉",
    "✨",
    "💗",
    "🎀",
    "🥳",
    "🌷"
  ];


  for(let i = 0; i < 28; i++){

    const e =
      document.createElement("div");

    e.className = "cake-spark";

    e.textContent =
      items[
        Math.floor(
          Math.random() * items.length
        )
      ];


    e.style.left = "50%";
    e.style.top = "43%";


    e.style.setProperty(
      "--dx",
      (Math.random() * 260 - 130) + "px"
    );


    e.style.setProperty(
      "--dy",
      (Math.random() * 260 - 150) + "px"
    );


    document.body.appendChild(e);


    setTimeout(function(){

      e.remove();

    },2000);

  }

}


/* =========================
   CONFETTI
========================= */

function confetti(){

  const items = [
    "🎉",
    "✨",
    "💗",
    "🎀",
    "🥳",
    "🌷"
  ];


  for(let i = 0; i < 22; i++){

    const e =
      document.createElement("div");

    e.className = "cake-spark";

    e.textContent =
      items[
        Math.floor(
          Math.random() * items.length
        )
      ];


    e.style.left =
      (Math.random() * 100) + "vw";

    e.style.top = "-20px";


    e.style.setProperty(
      "--dx",
      (Math.random() * 180 - 90) + "px"
    );


    e.style.setProperty(
      "--dy",
      (Math.random() * 700 + 250) + "px"
    );


    document.body.appendChild(e);


    setTimeout(function(){

      e.remove();

    },2200);

  }

}


/* =========================
   BIRTHDAY MUSIC
========================= */

let ac = null;
let musicOn = false;
let musicTimer = null;
let musicIndex = 0;


/* Birthday-style melody */
const melody = [

  392,
  392,
  440,
  392,
  523,
  494,

  392,
  392,
  440,
  392,
  587,
  523,

  392,
  392,
  784,
  659,
  523,
  494,
  440,

  698,
  698,
  659,
  523,
  587,
  523

];


/* Audio */
function audio(){

  if(!ac){

    ac =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(ac.state === "suspended"){

    ac.resume();

  }


  return ac;
}


/* Play note */
function note(
  freq,
  dur,
  when,
  type = "triangle",
  vol = .10
){

  const c = audio();

  const o =
    c.createOscillator();

  const g =
    c.createGain();


  o.type = type;

  o.frequency.setValueAtTime(
    freq,
    when
  );


  g.gain.setValueAtTime(
    .0001,
    when
  );


  g.gain.exponentialRampToValueAtTime(
    vol,
    when + .018
  );


  g.gain.exponentialRampToValueAtTime(
    .0001,
    when + dur
  );


  o.connect(g);

  g.connect(c.destination);


  o.start(when);

  o.stop(
    when + dur + .03
  );

}


/* Small beat */
function kick(when){

  const c = audio();

  const o =
    c.createOscillator();

  const g =
    c.createGain();


  o.type = "sine";


  o.frequency.setValueAtTime(
    120,
    when
  );


  o.frequency.exponentialRampToValueAtTime(
    48,
    when + .13
  );


  g.gain.setValueAtTime(
    .0001,
    when
  );


  g.gain.exponentialRampToValueAtTime(
    .16,
    when + .01
  );


  g.gain.exponentialRampToValueAtTime(
    .0001,
    when + .15
  );


  o.connect(g);

  g.connect(c.destination);


  o.start(when);

  o.stop(
    when + .17
  );

}


/* Play melody */
function playBar(){

  if(!musicOn){
    return;
  }


  const c = audio();

  const now =
    c.currentTime + .04;


  const f =
    melody[musicIndex];


  note(
    f,
    .25,
    now,
    "triangle",
    .10
  );


  note(
    f * 2,
    .18,
    now,
    "sine",
    .03
  );


  if(musicIndex % 2 === 0){

    kick(now);

  }


  musicIndex =
    (musicIndex + 1)
    % melody.length;


  musicTimer =
    setTimeout(
      playBar,
      310
    );

}


/* Start music */
function startMusic(){

  if(musicOn){
    return;
  }


  audio();

  musicOn = true;

  musicIndex = 0;


  document.getElementById("musicBtn")
    .textContent = "🔊";


  document.getElementById("musicBtn")
    .classList.add("on");


  playBar();

}


/* Stop music */
function stopMusic(){

  musicOn = false;

  clearTimeout(musicTimer);


  document.getElementById("musicBtn")
    .textContent = "🎵";


  document.getElementById("musicBtn")
    .classList.remove("on");

}


/* Music button */
function toggleMusic(){

  if(musicOn){

    stopMusic();

  }else{

    startMusic();

  }

}

</script>

</body>
</html>
